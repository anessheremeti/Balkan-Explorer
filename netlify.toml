[build]
  # Chromium is needed by scripts/prerender.mjs (run at the end of `npm run build`)
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  # Install browsers inside node_modules so Netlify's dependency cache keeps them
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Vite fingerprints everything in /assets, so it can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── PostHog reverse proxy ──────────────────────────────────────────────────
# Many ad blockers / privacy browsers (Brave, Firefox strict mode, uBlock)
# block requests to posthog.com domains outright, silently dropping every
# event from those visitors. Routing through our own domain first makes the
# request look same-origin, which blocklists don't flag.
# Must come BEFORE the SPA catch-all below — Netlify applies the first
# matching rule, and "/*" would otherwise swallow these paths.
[[redirects]]
  from = "/ingest/static/*"
  to = "https://eu-assets.i.posthog.com/static/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ingest/*"
  to = "https://eu.i.posthog.com/:splat"
  status = 200
  force = true

# ── SPA routes ─────────────────────────────────────────────────────────────
# Known React Router paths are rewritten to the SPA shell with a 200. These
# rules aren't forced, so a prerendered page (dist/about.html etc., written by
# scripts/prerender.mjs) is served instead whenever it exists. Keep this list
# in sync with src/App.tsx — the prerender step fails the build if a route
# from src/seo/routes.json is missing here.
[[redirects]]
  from = "/destination/*"
  to = "/app-shell.html"
  status = 200

